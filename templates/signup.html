{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="{% static 'style.css' %}" />
</head>
<body>
  <main>
    <form method="POST" action="{% url 'signup' %}">
      {% csrf_token %}
      <h3>Create account</h3>
      <p class="subtitle">Join us today</p>

      <label>
        <span>Exam Number</span>
        <input type="text" name="exam_number" id="id_username" placeholder="Enter your exam number" />
      </label>

      <label>
        <span>Email</span>
        <input type="email" name="email" id="id_email" placeholder="Enter your email" />
      </label>

      <label>
        <span>Password</span>
        <div class="passwd-wrap">
          <input type="password" name="password" id="id_password" placeholder="Enter your password..." required />
          <button type="button" class="show-passwd" id="show-passwd-1">
            <img src="{% static 'eye_open.svg' %}" alt="Show Password" />
          </button>
        </div>
      </label>

      <label>
        <span>Confirm Password</span>
        <div class="passwd-wrap">
          <input type="password" name="confirm_password" id="id_confirm_password" placeholder="Confirm your password..." required />
          <button type="button" class="show-passwd" id="show-passwd-2">
            <img src="{% static 'eye_open.svg' %}" alt="Show Password" />
          </button>
        </div>
      </label>

      <div class="button-wrap">
        <button class="button" type="submit">Sign up</button>
        <a href="{% url 'login' %}" class="button button-outline">Log in</a>
      </div>
    </form>
  </main>
  <script src="{% static 'main.js' %}"></script>
</body>
</html>
