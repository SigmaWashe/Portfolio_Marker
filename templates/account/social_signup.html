{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Sign Up</title>
  <link rel="stylesheet" href="{% static 'style.css' %}" />
</head>
<body>
  <main>
    <form method="POST" action="{% url 'socialaccount_signup' %}">
      {% csrf_token %}

      <div class="logo-row">
        <div class="logo-mark">PM</div>
        <div class="logo-text">Portfolio Marker</div>
      </div>

      <div class="accent-bar"></div>
      <h3>One more step</h3>
      <p class="subtitle">Complete your account setup</p>

      {{ form.as_p }}

      <div class="button-wrap">
        <button type="submit" class="button">Finish setup</button>
      </div>
    </form>
  </main>
</body>
</html>
