{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="{% static 'base.css' %}" />
  <link rel="stylesheet" href="{% static 'auth.css' %}" />
  <style>
    .role-tabs {
      display: flex;
      gap: 0.4rem;
      background: #F5F5F4;
      border-radius: 0.65rem;
      padding: 0.3rem;
      margin-bottom: 1.5rem;
    }
    .role-tab {
      flex: 1;
      padding: 0.55rem 0.75rem;
      border: none;
      border-radius: 0.5rem;
      background: transparent;
      color: #78716C;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .role-tab.active {
      background: #1E3A5F;
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
  <main class="auth-main">
    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}

      <div class="logo-row">
        <div class="logo-mark">PM</div>
        <div class="logo-text">Portfolio Marker</div>
      </div>

      <div class="accent-bar"></div>
      <h3>Welcome back</h3>

      {% if form.errors %}
        <p class="error">Invalid login credentials.</p>
      {% endif %}

      <p class="subtitle">Sign in to your account</p>

      <label>
        <input type="text" id="id_email" name="email" placeholder="Email" autocomplete="email" />
      </label>

      <label>
        <div class="passwd-wrap">
          <input type="password" name="password" id="id_password" placeholder="Password" required />
          <button type="button" class="show-passwd" id="show-passwd-1">
            <i data-lucide="eye" width="22" height="22"></i>
          </button>
        </div>
      </label>

      <div class="button-wrap">
        <button class="button" type="submit">Log in</button>
        <div class="divider">or</div>
        <a href="{% url 'google_login' %}" class="button-google">
          <img src="{% static 'images/google_icon.svg' %}" alt="Google Icon" width="20" height="20"/>
          Continue with Google
        </a>
        <a href="{% url 'signup' %}" class="button button-outline">Sign up</a>
      </div>
    </form>
  </main>
  </main>
  <script src="{% static 'main.js' %}"></script>
  </body>
</html>
